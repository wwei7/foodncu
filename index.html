<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>中央美食地圖</title>
  <style>
    body {
      font-family: "Microsoft JhengHei", sans-serif;
      background-color: #fffaf7;
      margin: 0;
      padding: 20px;
    }

    .title {
      text-align: center;
      font-size: 28px;
      color: #5a3e2b;
      border-bottom: 2px solid #e0d2c1;
      margin-bottom: 30px;
      padding-bottom: 10px;
    }

    .card-container {
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .card {
      background-color: #ffffff;
      border: 2px solid #8b5e3c; 
      border-radius: 12px;
      width: 250px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      padding: 15px;
      text-align: center;
    }

    .card h2 {
      font-size: 18px;
      margin: 10px 0;
      color: #5a3e2b; 
    }

    .card img {
        width: 100%;
        height: 250px;
        object-fit: cover;
        border-radius: 8px;
      }
      

    .card p {
      font-size: 14px;
      color: #666;
    }

    .card a {
      display: inline-block;
      margin-top: 10px;
      color: #e68a00;
      text-decoration: none;
      font-weight: bold;
    }

    .card a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <h1 class="title">我的美食地圖</h1>
  <div class="card-container">
    <div class="card">
      <h2>八方雲集</h2>
      <img src="8888.jpg" alt="八方雲集">
      <p>除了經典的招牌鍋貼和韭菜鍋貼，還有韓式辣味鍋貼、玉米鍋貼，也有使用植物肉做成的新蔬食鍋貼。</p>
      <a href="https://www.google.com/maps/place/%E5%85%AB%E6%96%B9%E9%9B%B2%E9%9B%86%E4%B8%AD%E5%A3%A2%E4%B8%AD%E5%A4%AE%E5%BA%97/@24.9667071,121.1860699,13z/data=!4m10!1m2!2m1!1z5YWr5pa56Zuy6ZuGIOmNi-iyvA!3m6!1s0x346822490ff4ee61:0x31d366fa261e1bcd!8m2!3d24.964684!4d121.1911339!15sChPlhavmlrnpm7Lpm4Yg6Y2L6LK8IgOIAQFaFiIU5YWr5pa5IOmbsumbhiDpjYvosrySARNkdW1wbGluZ19yZXN0YXVyYW504AEA!16s%2Fg%2F12cpp8hm8?entry=ttu&g_ep=EgoyMDI1MDQwOS4wIKXMDSoASAFQAw%3D%3D" target="_blank">查看位置</a>
    </div>
    <div class="card">
      <h2>迷路義麵屋</h2>
      <img src="noodles.jpg" alt="迷路義麵屋">
      <p> 迷路義麵屋是中央大學後門一家平價義大利麵餐廳。人氣很不錯，可以算是中大附近指標性的餐廳之一。 </p>
      <a href="https://www.google.com.tw/maps/place/%E8%BF%B7%E8%B7%AF%E7%BE%A9%E9%BA%B5%E5%B1%8B/@24.9646473,121.1881036,17z/data=!3m1!4b1!4m6!3m5!1s0x34682395330ecb9d:0x300d9a69fc2b3668!8m2!3d24.9646425!4d121.1906785!16s%2Fg%2F11c42hygp7?hl=zh-TW&entry=ttu&g_ep=EgoyMDI1MDQwOS4wIKXMDSoJLDEwMjExNDUzSAFQAw%3D%3D" target="_blank">查看位置</a>
    </div>
    <div class="card">
      <h2>No.17 White House</h2>
      <img src="rice.jpg" alt="No17">
      <p>位於中央大學附近，只有平日營業的餐廳，店還沒開就會看到排隊人潮，是相當受學生歡迎的義大利麵店</p>
      <a href="https://www.google.com.tw/maps/place/No.17+White+House/@24.9645137,121.1890771,17z/data=!3m1!4b1!4m6!3m5!1s0x346823952bf358bd:0xb7cd4cdecc7cc35e!8m2!3d24.9645089!4d121.191652!16s%2Fg%2F11bxdl12sf?hl=zh-TW&entry=ttu&g_ep=EgoyMDI1MDQwOS4wIKXMDSoJLDEwMjExNDUzSAFQAw%3D%3D" target="_blank">查看位置</a>
    </div>
  </div>
</body>
</html>
